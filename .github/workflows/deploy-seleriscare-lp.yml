name: Deploy Seleriscare LP to seleriscare.ai
# Re-triggered 2026-08-18 to verify workflow with secrets in place.

on:
  push:
    branches:
      - release/production
  workflow_dispatch:

concurrency:
  group: deploy-seleriscare-lp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Clean Vite/Vue setup — no TypeScript, no peer-dep conflicts, no
        # --legacy-peer-deps needed (unlike trust/salvion/selica projects).
        run: npm ci

      - name: Build
        # No VITE_ env vars used in src/ — no CI env needed.
        run: npm run build

      - name: Verify dist exists
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html not produced by build" && exit 1)
          echo "Asset count: $(ls dist/assets 2>/dev/null | wc -l)"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_SSH_PORT }} -H ${{ secrets.DEPLOY_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup current dist on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            "cd /var/www/html/selica/seleriscare-lp && \
             rm -rf dist.previous && \
             [ -d dist ] && cp -a dist dist.previous || true && \
             echo 'Backup ready'"

      - name: Upload new dist to staging directory
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            "rm -rf /var/www/html/selica/seleriscare-lp/dist.new && mkdir -p /var/www/html/selica/seleriscare-lp/dist.new"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }}" \
            dist/ \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/var/www/html/selica/seleriscare-lp/dist.new/

      - name: Atomic swap and reload nginx
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }} \
            ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            "set -e && \
             cd /var/www/html/selica/seleriscare-lp && \
             chown -R www-data:www-data dist.new && \
             rm -rf dist.old && \
             [ -d dist ] && mv dist dist.old || true && \
             mv dist.new dist && \
             nginx -t && \
             systemctl reload nginx && \
             echo 'Deploy complete.'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Smoke test deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://seleriscare.ai/)
          echo "HTTPS status: $STATUS"
          test "$STATUS" = "200" || (echo "::error::Smoke test failed: got $STATUS" && exit 1)
