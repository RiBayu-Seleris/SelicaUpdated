<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description (WAJIB SEO) -->
    <!-- <title>SMI AI Solution – AI Innovation for the Future of Technology</title> -->
    <meta
      name="description"
      content="SMI AI Solution delivers AI-driven innovation to transform technology, healthcare, and digital business for a smarter future."
    />

    <!-- Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph (Social Preview) -->
    <meta property="og:title" content="SMI AI Solution - AI Innovation" />
    <meta
      property="og:description"
      content="AI-powered solutions for future-ready technology and digital transformation."
    />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Animation Libraries -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>

  <body>
    <div id="app"></div>

    <!-- App -->
    <script type="module" src="/src/main.js"></script>

    <!-- AOS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  </body>
</html>
