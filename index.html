<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Warna dasar halaman. Ditulis langsung di sini (bukan di style.css)
         supaya sudah berlaku pada gambar PERTAMA browser, sebelum berkas CSS
         dan JavaScript selesai diunduh. Dua hal bergantung padanya:
         1. Tanpa ini halaman sempat putih polos beberapa saat, lalu warnanya
            melompat begitu layar loading tampil.
         2. Pencegat tombol refresh di App.vue menutup gerbang lebih dulu baru
            memuat ulang. Dokumen barunya harus menggambar latar dengan warna
            yang sama persis, kalau tidak muat ulangnya justru terlihat
            sebagai kedipan di balik gerbang yang seharusnya menutupinya. -->
    <style>
      html {
        background-color: #f9f9f9;
      }
      html.dark {
        background-color: #17181a;
      }
    </style>

    <!-- Tema tersimpan diterapkan sebelum halaman digambar, supaya tidak ada
         kedipan gelap-ke-terang saat refresh. Sebelumnya kelas "dark" ditulis
         mati di tag <html>, jadi pengunjung mode terang — yaitu semua orang,
         karena situs ini tidak punya tombol ganti tema — selalu melihat
         kilatan gelap sepersekian detik sampai loadTheme() di App.vue sempat
         membetulkannya. Yang paling kentara justru di layar loadingnya, yang
         memang tampil dua detik penuh.

         Aturannya HARUS sama persis dengan loadTheme() di
         src/stores/theme.js — kalau berbeda, kedipannya cuma berpindah
         tempat. -->
    <script>
      (function () {
        try {
          var gelap = localStorage.getItem("isDark") === "true";
          document.documentElement.classList.toggle("dark", gelap);
        } catch (e) {
          /* localStorage diblokir (mode penyamaran) — biarkan mode terang */
        }
      })();
    </script>

    <!-- Title & Description (WAJIB SEO) -->
    <!-- <title>SMI AI Solution – AI Innovation for the Future of Technology</title> -->
    <meta
      name="description"
      content="SMI AI Solution delivers AI-driven innovation to transform technology, healthcare, and digital business for a smarter future."
    />

    <!-- Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <!-- Re push Change icon -->
    <!-- Re push 2 Change icon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph (Social Preview) -->
    <meta property="og:title" content="SMI AI Solution - AI Innovation" />
    <meta
      property="og:description"
      content="AI-powered solutions for future-ready technology and digital transformation."
    />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Animation Libraries -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0B0B" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon-180.png"
    />
    <meta name="apple-mobile-web-app-title" content="SELICA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>

  <body>
    <div id="app"></div>

    <!-- App -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
