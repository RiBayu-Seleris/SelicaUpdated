<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html {
        background-color: #f9f9f9;
      }
      html.dark {
        background-color: #17181a;
      }
    </style>

    <script>
      (function () {
        try {
          var gelap = localStorage.getItem("isDark") === "true";
          document.documentElement.classList.toggle("dark", gelap);
        } catch (e) {}
      })();
    </script>

    <!-- Title & Description (WAJIB SEO) -->
    <!-- <title>SMI AI Solution – AI Innovation for the Future of Technology</title> -->
    <meta
      name="description"
      content="SMI AI Solution delivers AI-driven innovation to transform technology, healthcare, and digital business for a smarter future."
    />

    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <meta property="og:title" content="SMI AI Solution - AI Innovation" />
    <meta
      property="og:description"
      content="AI-powered solutions for future-ready technology and digital transformation."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0B0B" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon-180.png"
    />
    <meta name="apple-mobile-web-app-title" content="SELICA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>

  <body>
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
